[package]
name = "flowpunct"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RedMait/WispFlowStealer"
rust-version = "1.75"
description = "Russian punctuation + casing restoration (RUPunct_small, pure-Rust ONNX runtime)"

[dependencies]
tract-onnx = { version = "0.21.3", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
# Enables the neural model: pulls the pure-Rust tract-onnx runtime.
onnx = ["dep:tract-onnx", "dep:serde_json"]