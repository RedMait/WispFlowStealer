[package]
name = "flowvoice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hold-to-talk voice dictation with auto-formatting"

[dependencies]
flowcore = { path = "../flowcore" }

cpal = { version = "0.15", optional = true }
vosk = { version = "0.3", optional = true }
arboard = { version = "3.4", optional = true }

[features]
default = []
# Full dictation pipeline: microphone capture + local speech-to-text + clipboard.
# Native speech libs make this Windows-friendly; build it locally for the demo.
audio = ["dep:cpal", "dep:vosk", "dep:arboard"]